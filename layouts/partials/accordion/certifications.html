{{ range hugo.Data.certifications.categories }}
<div class="mb-3">
  <p class="mb-0 font-semibold">
    <i class="{{ .icon }}"></i> {{ .name }}
  </p>
  {{ range .list }}
  <p class="mb-0 ms-4 text-gray-600 dark:text-gray-300">
    <span class="font-semibold">{{ .name }}</span> &mdash; {{ .org }}
  </p>
  {{ end }}
</div>
{{ end }}
