baseURL: /
locale: en-us
build:
  writeStats: true
title: "Mathieu // Site personnel"
# Uncomment below to use aafu as hugo theme. See instructions in README.md
theme: aafu

params:
  author: Mathieu Nabonne
  description: Mathieu personnal Website
  copyright: powered by [hugo](https://gohugo.io/)
  theme:
    mainTheme: null
    showAttribute: true
    singlePage: false
  accordion:
    - item: about_me
      expand: true # only the first `expand: true` will take effect
    - item: certifications
    - item: experiences
    - item: education
    - item: projects
    - item: skills
      panel_id: skill-panel
    - item: hobbies

security:
  exec:
    allow:
      - "^(dart-)?sass$"
      - "^go$"
      - "^git$"
      - "^node$"
      - "^postcss$"
      - "^tailwindcss$"

  node:
    permissions:
      disable: true
